name: Minimal Base Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🛠️ Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      - name: 🐾 Ensure Gradle Wrapper
        working-directory: Android
        run: |
          if [ ! -f "gradlew" ] || [ ! -x "gradlew" ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.2
            chmod +x gradlew
          fi

      - name: 🏗️ Build Minimal APK (Source Disabled)
        working-directory: Android
        run: |
          set -o pipefail
          # Notice EXCLUDE_GAME_SRC=ON: This disables the main game code
          ./gradlew clean assembleDebug \
            -Pandroid.externalNativeBuild.cmake.arguments="-DEXCLUDE_GAME_SRC=ON" \
            --info \
            --stacktrace 2>&1 | tee ../build.log || true

      - name: 📦 Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: minimal-base-apk
          path: Android/app/build/outputs/apk/debug/*.apk

      - name: 🚑 Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimal-build-logs
          path: build.log
