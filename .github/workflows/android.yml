name: Android Build & OTR Verification

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🛠️ Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      - name: 🖼️ Generate Android Icons
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          if [ ! -f "icon_master.png" ]; then
            convert -size 512x512 xc:blue icon_master.png
          fi
          python3 scripts/generate_icons.py icon_master.png

      # =========================
      # PHASE 1: HEADER FOUNDATION
      # =========================

      - name: 🧹 Clean Previous Generated Headers
        run: rm -f Android/app/src/main/cpp/ultra/n64_types.h

      - name: 🛠️ Generate Master Header
        run: python3 scripts/fix_n64_types.py

      - name: 🧬 Apply Banjo Compatibility Layer
        run: python3 scripts/banjo_structural_patch.py

      - name: 🧪 Inject Sanitizer Definitions
        run: python3 scripts/patch_sanitizer_defs.py

      - name: 🌍 Patch ALGlobals
        run: python3 scripts/patch_alglobals.py

      - name: ✏️ Patch OSPri & M_PI
        run: python3 scripts/patch_ospri.py

      - name: 🎮 Patch Missing Graphics Macros
        run: python3 scripts/fix_missing_macros.py

      - name: 🔍 Validate Generated Header
        run: |
          echo "Checking header integrity..."
          HEADER="Android/app/src/main/cpp/ultra/n64_types.h"

          if [ ! -f "$HEADER" ]; then
            echo "❌ Header not generated"
            exit 1
          fi

          grep -q "typedef unsigned char u8;" "$HEADER" || { echo "❌ Missing u8 typedef"; exit 1; }
          grep -q "ALGlobals" "$HEADER" || { echo "❌ Missing ALGlobals"; exit 1; }

          echo "✅ Header validation passed"

      # =========================
      # PHASE 2: SANITIZATION
      # =========================

      - name: 🧹 Codebase Sanitization
        run: python3 scripts/sanitize_codebase.py .

      # =========================
      # PHASE 3: DECOMPILER FIXES
      # =========================

      - name: 🩹 Auto-Fix N64 NULL Floats
        run: python3 scripts/fix_null_floats.py

      - name: 🏗️ Auto-Hoist Function Pointers
        run: python3 scripts/fix_function_pointers.py

      - name: 📐 Auto-Fix Struct Ordering
        run: python3 scripts/fix_struct_ordering.py

      - name: 🖊️ Final Include Guard Validation
        run: python3 scripts/endif-fixer.py

      # =========================
      # BUILD PREP
      # =========================

      - name: 🐘 Ensure Gradle Wrapper Exists
        working-directory: Android
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "⚠️ Gradle wrapper missing — generating..."
            gradle wrapper --gradle-version 8.2
          fi
          chmod +x gradlew

      # =========================
      # BUILD
      # =========================

      - name: 🗺️ Generate Asset Manifests
        run: |
          pip3 install pyyaml
          python3 scripts/generate_manifest.py

      - name: 🐘 Build Full Game APK
        working-directory: Android
        run: |
          set -o pipefail
          ./gradlew clean assembleDebug \
            -Pandroid.externalNativeBuild.cmake.arguments="-DEXCLUDE_GAME_SRC=OFF" \
            --info \
            --stacktrace 2>&1 | tee ../build.log

      - name: 📦 Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bka-full-game-apk
          path: Android/app/build/outputs/apk/debug/*.apk

      # =========================
      # DIAGNOSTICS
      # =========================

      - name: 🔍 Run Failure Analyzer
        if: failure()
        run: python3 scripts/analyze_build_log.py build.log

      - name: 🚑 Upload Failure Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bka-failure-logs
          path: |
            build.log
            build_failure_summary.txt