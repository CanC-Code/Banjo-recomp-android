Name: Android Build & OTR Verification

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🛠️ Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      - name: 🖼️ Generate Android Icons
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          if [ ! -f "icon_master.png" ]; then
            convert -size 512x512 xc:blue icon_master.png
          fi
          python3 scripts/generate_icons.py icon_master.png

      # =========================
      # PHASE 1: HEADER FOUNDATION
      # =========================

      - name: 🧹 Clean Previous Generated Headers
        run: rm -f Android/app/src/main/cpp/ultra/n64_types.h

      - name: 🛠️ Generate Master Header
        run: python3 scripts/fix_n64_types.py

      - name: 🧬 Apply Banjo Compatibility Layer
        run: python3 scripts/banjo_structural_patch.py

      - name: 🧪 Inject Sanitizer Definitions
        run: python3 scripts/patch_sanitizer_defs.py

      - name: 🌍 Patch ALGlobals
        run: python3 scripts/patch_alglobals.py

      - name: ✏️ Patch OSPri & M_PI
        run: python3 scripts/patch_ospri.py

      - name: 🎮 Patch Missing Graphics Macros
        run: python3 scripts/fix_missing_macros.py

      - name: 🔍 Validate Generated Header
        run: |
          echo "Checking header integrity..."
          HEADER="Android/app/src/main/cpp/ultra/n64_types.h"

          if [ ! -f "$HEADER" ]; then
            echo "❌ Header not generated"
            exit 1
          fi

          grep -Eq "typedef[[:space:]]+unsigned[[:space:]]+char[[:space:]]+u8;" "$HEADER" \
            || { echo "❌ Missing or malformed u8 typedef"; exit 1; }
          
          grep -q "ALGlobals" "$HEADER" \
            || { echo "❌ Missing ALGlobals definition"; exit 1; }

          echo "✅ Header validation passed"

      # =========================
      # PHASE 2: SANITIZATION
      # =========================

      - name: 🧹 Codebase Sanitization
        run: python3 scripts/sanitize_codebase.py .

      # =========================
      # PHASE 3: DECOMPILER FIXES
      # =========================

      - name: 🩹 Auto-Fix N64 NULL Floats
        run: python3 scripts/fix_null_floats.py

      - name: 🏗️ Auto-Hoist Function Pointers
        run: python3 scripts/fix_function_pointers.py

      - name: 📐 Auto-Fix Struct Ordering
        run: python3 scripts/fix_struct_ordering.py

      - name: 制️ Final Include Guard Validation
        run: python3 scripts/endif-fixer.py

      # =========================
      # BUILD PREP
      # =========================

      - name: 🐘 Ensure Gradle Wrapper Exists
        working-directory: Android
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "⚠️ Gradle wrapper missing — generating..."
            gradle wrapper --gradle-version 8.2
          fi
          chmod +x gradlew

      # =========================
      # BUILD
      # =========================

      - name: 🗺️ Generate Asset Manifests
        run: |
          pip3 install pyyaml
          python3 scripts/generate_manifest.py

      - name: Harmonize AArch64 Headers
        run: |
          chmod +x scripts/harmonize_aarch64_headers.py
          python3 scripts/harmonize_aarch64_headers.py --root .
        working-directory: ${{ github.workspace }}

      - name: 🛠️ Run Phase 2 Harmonizer
        run: |
          cat << 'EOF' > scripts/harmonizer_2.py
          #!/usr/bin/env python3
          import os
          import re
          import sys

          def run_phase2_harmonizer(workspace_root):
              filepath = os.path.join(workspace_root, "Android", "app", "src", "main", "cpp", "ultra", "n64_types.h")
              if not os.path.exists(filepath):
                  print(f"[-] ERROR: {filepath} missing")
                  sys.exit(1)

              with open(filepath, 'r', encoding='utf-8') as f:
                  content = f.read()

              if "/* --- HARMONIZER_" in content:
                  content = content.split("/* --- HARMONIZER_")[0]

              types_to_isolate = [
                  'ALCmdHandler', 'ALSetParam', 'ALParam', 'ALPVoice', 'N_PVoice', 
                  'ALSetFXParam', 'ALStartParam', 'ALStartParamAlt', 'ALFilter', 'N_ALVoice',
                  'ALVoiceState', 'ALEvent', 'ALEventListItem'
              ]
              
              for t in types_to_isolate:
                  content = re.sub(rf'(?<!WRAPPER_)\b{t}\b', f'WRAPPER_{t}', content)
                  
              injection = """
          /* --- HARMONIZER_V4_APPLIED --- */
          #ifndef BKA_HARMONIZER_INJECT
          #define BKA_HARMONIZER_INJECT
          #include <PR/ultratypes.h>
          typedef struct ALParam_s {
              struct ALParam_s *next;
              s32 delta;
              s16 type;
              union { f32 f; s32 i; } data;
          } ALParam;
          typedef ALParam ALStartParam;
          typedef ALParam ALStartParamAlt;
          typedef void (*ALCmdHandler)(void *, s16 *, s32, s32 *);
          typedef s32  (*ALSetParam)(void *, s32, void *);
          typedef s32  (*ALSetFXParam)(void *, s32, void *);
          typedef struct ALFilter_s ALFilter;
          typedef struct ALPVoice_s ALPVoice;
          typedef struct N_PVoice_s N_PVoice;
          typedef struct N_ALVoice_s N_ALVoice;
          #endif
          /* ----------------------------- */
          """
              with open(filepath, 'w', encoding='utf-8') as f:
                  f.write(content.rstrip() + "\n\n" + injection.strip() + "\n")
              print("[+] Harmonization applied to n64_types.h")
          if __name__ == "__main__":
              run_phase2_harmonizer(".")
          EOF
          chmod +x scripts/harmonizer_2.py
          python3 scripts/harmonizer_2.py

      - name: 🐘 Build Full Game APK
        working-directory: Android
        run: |
          set -o pipefail
          ./gradlew clean assembleDebug \
            -Pandroid.externalNativeBuild.cmake.arguments="-DEXCLUDE_GAME_SRC=OFF" \
            --info \
            --stacktrace 2>&1 | tee ../build.log

      - name: 📦 Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bka-full-game-apk
          path: Android/app/build/outputs/apk/debug/*.apk

      # =========================
      # DIAGNOSTICS
      # =========================

      - name: 🔍 Run Failure Analyzer & Export Header
        if: failure()
        run: |
          python3 scripts/analyze_build_log.py build.log
          echo "====================================================" >> build_failure_summary.txt
          echo "FINAL STATE OF n64_types.h AT TIME OF FAILURE:" >> build_failure_summary.txt
          echo "====================================================" >> build_failure_summary.txt
          cat Android/app/src/main/cpp/ultra/n64_types.h >> build_failure_summary.txt

      - name: 🚑 Upload Failure Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bka-failure-logs
          path: |
            build.log
            build_failure_summary.txt
