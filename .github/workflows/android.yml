name: Android Build & OTR Verification

on:
  workflow_dispatch:

jobs:
  validate-otr-and-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🛠️ Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔨 Validate OTR Builder (Native Logic)
        run: |
          echo "Verifying OTR Extraction Logic..."
          cd Android/app/src/main/cpp
          # We define NO_GAME_SRC here so the compiler doesn't look for game symbols
          # during this host-side smoke test.
          g++ -c ultra/otr_builder.cpp tools/rare_decompression.cpp -I. -Iultra -Itools -DNO_GAME_SRC

      - name: 🐘 Build APK (Excluding Base Source)
        run: |
          cd Android
          chmod +x gradlew
          # We pass the CMake flag through Gradle using -Pandroid.externalNativeBuild.cmake.arguments
          ./gradlew assembleDebug \
            -Pandroid.externalNativeBuild.cmake.arguments="-DEXCLUDE_GAME_SRC=ON" \
            --stacktrace

      # Optional: Verify the APK actually contains the native library
      - name: 🔍 Verify Shared Library
        run: |
          sudo apt-get install -y unzip
          APK_PATH=$(find Android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          unzip -l "$APK_PATH" | grep "libbkawrapper.so"

      - name: 📦 Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: banjo-recomp-debug-apk
          path: Android/app/build/outputs/apk/debug/*.apk
