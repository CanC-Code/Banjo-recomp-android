name: Android Build & OTR Verification

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🛠️ Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      - name: 🖼️ Generate Android Icons
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          if [ ! -f "icon_master.png" ]; then
            convert -size 512x512 xc:blue icon_master.png
          fi
          python3 scripts/generate_icons.py icon_master.png

      - name: 🧹 Pre-Patching (Sanitizer)
        run: python3 scripts/sanitize_codebase.py .

      - name: 🗺️ Generate Asset Manifests
        run: |
          pip3 install pyyaml
          # Ensure this script has 'import' (lowercase) fixed
          python3 scripts/generate_manifest.py

      - name: 🐘 Build Full Game APK
        run: |
          cd Android
          chmod +x gradlew
          # 'clean' ensures CMake re-evaluates the EXCLUDE_GAME_SRC flag
          # '--info' allows us to see the 'message(STATUS ...)' logs from CMakeLists.txt
          ./gradlew clean assembleDebug \
            -Pandroid.externalNativeBuild.cmake.arguments="-DEXCLUDE_GAME_SRC=OFF" \
            --info \
            --stacktrace

      - name: 📦 Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bka-full-game-apk
          path: Android/app/build/outputs/apk/debug/*.apk
