name: Android Build & OTR Verification

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🛠️ Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      - name: 🖼️ Generate Android Icons
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          if [ ! -f "icon_master.png" ]; then
            convert -size 512x512 xc:blue icon_master.png
          fi
          python3 scripts/generate_icons.py icon_master.png

      - name: 🧹 Pre-Patching (Sanitizer)
        run: python3 scripts/sanitize_codebase.py .

      - name: 🩹 Auto-Fix N64 NULL Floats
        run: python3 scripts/fix_null_floats.py

      - name: 📐 Auto-Fix Struct Ordering
        run: python3 scripts/fix_struct_ordering.py

      - name: 🔧 Auto-Fix Missing vu32 Types
        run: python3 scripts/fix_vu32.py

      - name: 🎮 Auto-Fix Missing Graphics Macros
        run: python3 scripts/fix_missing_macros.py

      - name: 🛠️ Auto-Generate n64_bool.h
        run: python3 scripts/fix_n64_bool.py

      - name: 💉 Auto-Fix Missing Method Types
        run: python3 scripts/fix_missing_methods.py

      - name: 🗺️ Generate Asset Manifests
        run: |
          pip3 install pyyaml
          # Ensure this script uses lowercase 'import'
          python3 scripts/generate_manifest.py

      - name: 🐘 Build Full Game APK
        run: |
          cd Android
          # `pipefail` ensures the action catches the error even if `tee` succeeds
          set -o pipefail
          
          # We pipe standard output and standard error (2>&1) into tee
          gradle clean assembleDebug \
            -Pandroid.externalNativeBuild.cmake.arguments="-DEXCLUDE_GAME_SRC=OFF" \
            --info \
            --stacktrace 2>&1 | tee ../build.log

      - name: 📦 Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bka-full-game-apk
          path: Android/app/build/outputs/apk/debug/*.apk

      # --- DIAGNOSTIC STEPS (Only run if the build fails) ---
      
      - name: 🔍 Run Failure Analyzer
        if: failure()
        run: |
          # Run the script we just created against the captured log
          python3 scripts/analyze_build_log.py build.log

      - name: 🚑 Upload Failure Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bka-failure-logs
          path: |
            build.log
            build_failure_summary.txt
