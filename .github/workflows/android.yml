name: Android Build & OTR Verification

on:
workflow_dispatch:

jobs:
validate:
runs-on: ubuntu-latest

steps:
  # --- CHECKOUT ---
  - name: 📥 Checkout Code
    uses: actions/checkout@v4
    with:
      submodules: recursive

  # --- JAVA ---
  - name: ☕ Set up JDK 17
    uses: actions/setup-java@v4
    with:
      java-version: '17'
      distribution: 'temurin'

  # --- PYTHON (GLOBAL FIX) ---
  - name: 🐍 Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.11'

  - name: 📦 Install Python Dependencies
    run: |
      python -m pip install --upgrade pip
      pip install pyyaml

  # --- ANDROID ---
  - name: 🛠️ Set up Android SDK
    uses: android-actions/setup-android@v3

  # --- GRADLE CACHE ---
  - name: 🐘 Setup Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: 8.2

  # --- ICONS ---
  - name: 🖼️ Generate Android Icons
    run: |
      sudo apt-get update
      sudo apt-get install -y imagemagick

      if [ ! -f "icon_master.png" ]; then
        convert -size 512x512 xc:blue icon_master.png
      fi

      python scripts/generate_icons.py icon_master.png

  # =========================
  # PHASE 1: HEADER FOUNDATION
  # =========================

  - name: 🛠️ Master Header Generation
    run: python scripts/fix_n64_types.py

  - name: 🧬 Banjo Compatibility Layer
    run: python scripts/banjo_structural_patch.py

  - name: 🧪 Inject Sanitizer Definitions
    run: python scripts/patch_sanitizer_defs.py

  - name: 🌍 Patch ALGlobals
    run: python scripts/patch_alglobals.py

  - name: ✏️ Patch OSPri & M_PI
    run: python scripts/patch_ospri.py

  - name: 🎮 Patch Missing Graphics Macros
    run: python scripts/fix_missing_macros.py

  # =========================
  # PHASE 2: CODE SANITIZATION
  # =========================

  - name: 🧹 Codebase Sanitization
    run: python scripts/sanitize_codebase.py .

  # =========================
  # PHASE 3: SAFE CLEANUP
  # =========================

  - name: 🩹 Fix NULL Floats
    run: python scripts/fix_null_floats.py

  - name: 🏗️ Fix Function Pointers
    run: python scripts/fix_function_pointers.py

  - name: 📐 Fix Struct Ordering
    run: python scripts/fix_struct_ordering.py

  - name: 🖊️ Validate Include Guards
    run: python scripts/endif-fixer.py

  # =========================
  # BUILD PREP
  # =========================

  - name: 🗺️ Generate Asset Manifests
    run: python scripts/generate_manifest.py

  # =========================
  # BUILD
  # =========================

  - name: 🐘 Build Full Game APK
    run: |
      cd Android
      chmod +x gradlew
      set -o pipefail

      ./gradlew clean assembleDebug \
        -Pandroid.externalNativeBuild.cmake.arguments="-DEXCLUDE_GAME_SRC=OFF" \
        --info \
        --stacktrace 2>&1 | tee ../build.log

  # =========================
  # ARTIFACTS
  # =========================

  - name: 📦 Upload APK
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: bka-full-game-apk
      path: Android/app/build/outputs/apk/debug/*.apk

  # =========================
  # FAILURE HANDLING
  # =========================

  - name: 🔍 Analyze Build Failure
    if: failure()
    run: python scripts/analyze_build_log.py build.log

  - name: 🚑 Upload Failure Logs
    if: failure()
    uses: actions/upload-artifact@v4
    with:
      name: bka-failure-logs
      path: |
        build.log
        build_failure_summary.txt