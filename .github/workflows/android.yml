name: Android Build & OTR Verification

on:
  workflow_dispatch:

jobs:
  validate-otr-and-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🛠️ Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔨 Validate OTR Builder (Native Logic)
        run: |
          echo "Verifying OTR Extraction Logic..."
          cd Android/app/src/main/cpp
          # We check if the C++ logic compiles for the host to ensure extraction remains functional
          g++ -c ultra/otr_builder.cpp tools/rare_decompression.cpp -I. -Iultra -Itools

      - name: 🐘 Build APK (Excluding Base Source)
        run: |
          cd Android
          chmod +x gradlew
          # We use -PexcludeSource=true if your build.gradle supports it, 
          # otherwise, we simply build the debug target.
          ./gradlew assembleDebug --stacktrace

      - name: 📦 Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: banjo-recomp-debug-apk
          path: Android/app/build/outputs/apk/debug/*.apk
