name: Android Build & OTR Verification

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🛠️ Set up Android SDK
        uses: android-actions/setup-android@v3

      # =============================================
      # GRADLE SETUP (critical fixes)
      # =============================================
      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      - name: 🐾 Generate Gradle Wrapper if Missing
        working-directory: Android
        run: |
          if [ ! -f "gradlew" ] || [ ! -x "gradlew" ]; then
            echo "⚠️ Gradle wrapper missing or not executable - generating..."
            gradle wrapper --gradle-version 8.2
            chmod +x gradlew
          else
            echo "✅ Gradle wrapper exists and is executable"
          fi

      - name: Verify Gradle Wrapper
        working-directory: Android
        run: |
          if [ ! -f "gradlew" ]; then
            echo "❌ FAILED: Gradle wrapper still missing after generation"
            exit 1
          fi
          if [ ! -x "gradlew" ]; then
            echo "❌ FAILED: Gradle wrapper is not executable"
            exit 1
          fi
          echo "✅ Gradle wrapper verified"

      - name: 🖼️ Generate Android Icons
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          if [ ! -f "icon_master.png" ]; then
            convert -size 512x512 xc:blue icon_master.png
          fi
          python3 scripts/generate_icons.py icon_master.png

      # =============================================
      # HEADER FOUNDATION & PATCHES
      # =============================================
      - name: 🧹 Clean Previous Generated Headers
        run: rm -f Android/app/src/main/cpp/ultra/n64_types.h

      - name: 🛠️ Generate Master Header
        run: python3 scripts/fix_n64_types.py

      - name: 🧬 Apply Banjo Compatibility Layer
        run: python3 scripts/banjo_structural_patch.py

      - name: 🧪 Inject Sanitizer Definitions
        run: python3 scripts/patch_sanitizer_defs.py

      - name: 🌍 Patch ALGlobals
        run: python3 scripts/patch_alglobals.py

      - name: ✏️ Patch OSPri & M_PI
        run: python3 scripts/patch_ospri.py

      - name: 🎮 Patch Missing Graphics Macros
        run: python3 scripts/fix_missing_macros.py

      # =============================================
      # SANITIZATION
      # =============================================
      - name: 🧹 Codebase Sanitization
        run: python3 scripts/sanitize_codebase.py .

      # =============================================
      # ASSETS & BUILD
      # =============================================
      - name: 🗺️ Generate Asset Manifests
        run: |
          pip3 install pyyaml
          python3 scripts/generate_manifest.py

      - name: 🏗️ Build Full Game APK
        working-directory: Android
        run: |
          set -o pipefail
          ./gradlew clean assembleDebug \
            -Pandroid.externalNativeBuild.cmake.arguments="-DEXCLUDE_GAME_SRC=OFF" \
            --info \
            --stacktrace 2>&1 | tee ../build.log || true

      - name: 📦 Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bka-apk
          path: Android/app/build/outputs/apk/debug/*.apk

      - name: 🚑 Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bka-build-logs
          path: |
            build.log
            Android/app/src/main/cpp/ultra/n64_types.h
